    import_see: "Voir dans Favoris"
    import_accounts: "Relier son compte YouTube ou SoundCloud (pour importer ses « J'aime » privés) : pas encore possible."
  whatsnew:
    title: "Nouveautés : tout ce que le site fait en plus de Subsonic"
    idea_title: "Le principe, en trois phrases"
    idea_1: "Subsonic reste la maison de notre musique : vos étoiles, vos cœurs, vos playlists et vos écoutes y sont écrits avec votre compte, donc vous les retrouvez aussi dans les applis Subsonic du téléphone."
    idea_2: "Le site, lui, ajoute tout ce que Subsonic ne sait pas faire : écouter ensemble, papoter, se perdre dans des mix, et aller chercher ailleurs le titre qui manque."
    idea_3: "YouTube et SoundCloud passent par leurs lecteurs officiels, donc parfois avec les bloqueur de pub <b>mais Addblock fonctionne pas mal :-)<b/>."
    open: "J'y vais"
    versions: "Ce qui a changé, version par version"
    together:
      title: "Ensemble, c'est mieux"
      chat:
        title: "Le salon"
        text: "Touche C, et le panneau de droite s'ouvre : on discute en direct. Répondez, réagissez avec un emoji, appelez quelqu'un avec @ (ça le prévient), balancez un album d'un clic. Et on voit qui est là, et qui est en train d'écrire…"
      listening:
        title: "Écouté en ce moment"
        text: "En haut du salon : ce que tout le monde écoute, là, maintenant. Pratique pour piquer les bonnes idées des autres — un clic et vous êtes sur l'album."
      comments:
        title: "On en parle sous l'album"
        text: "Chaque album a son fil de discussion, et ses étoiles : la vôtre, et la moyenne de la bande."
      news:
        title: "Actualité : les flux RSS des webzines"
        text: "Le site lit chaque heure les flux RSS des webzines (Les Inrocks, Mowno, New Noise…) et range leurs derniers articles dans la page Actualité. Il en manque un ? Collez l'adresse du webzine, ou de son flux RSS : le site trouve le flux tout seul, et il sert à tout le monde. Ceux qui vous barbent, décochez-les : ils disparaissent pour vous seulement. Cerise : sur la page d'un artiste, « Dans la presse » ressort les articles qui parlent de lui. On clique, et on lit l'article chez le webzine."
    discover:
      title: "Se perdre dans la musique"
      mix:
        title: "Mix en un clic"
        text: "Au hasard, vos favoris, découverte, nouveautés : quatre boutons, zéro réflexion."
      builder:
        title: "Créateur de mix"
        text: "Pour les maniaques : un artiste de départ, des styles, des époques, 30, 60 ou 100 titres, vos favoris d'abord, ou dans l'ordre chronologique. Ça vous plaît ? Enregistrez-le en playlist."
      radio:
        title: "Radio d'un artiste ou d'un titre"
        text: "Partez d'un artiste : ses titres, puis ceux qui lui ressemblent, puis les proches des proches… jusqu'à quatre niveaux. Ou, au bout d'un morceau de la bibliothèque, cliquez sur « Radio de ce titre » : ce morceau démarre, suivi de titres proches. Si Last.fm ne propose rien, on reste dans le même style, puis on pioche au hasard dans la bibliothèque."
      similar:
        title: "Artistes similaires, titres populaires"
        text: "Sur chaque page d'artiste, merci Last.fm : ses voisins présents dans la bibliothèque et ses titres les plus connus. Avec « Membres et autres projets », suivez aussi les musiciens d'un groupe vers leurs autres aventures : les liens MusicBrainz indiquent les périodes connues."
      home:
        title: "Accueil et Albums"
        text: "Les derniers arrivés, les plus écoutés, les mieux notés par tout le monde, ceux dont on parle. Survolez une pochette : la petite flèche en haut à gauche lance l’album sans quitter la page ; le reste de la carte ouvre sa fiche. Et la page Albums pour fouiller par décennie, par genre ou de A à Z. Sur un album, « Découvrir les crédits » ouvre les labels, producteurs et musiciens : suivez leurs disques et leurs groupes grâce à MusicBrainz."
    playlists:
      title: "Les playlists, version deluxe"
      drag:
        title: "Glisser-déposer"
        text: "Attrapez un titre, ou carrément la pochette d'un album, et lâchez-le sur une playlist dans la barre de gauche : c'est ajouté. L'onglet Playlists s'ouvre tout seul pendant que vous glissez. Lâchez sur « + » et une nouvelle playlist naît. Sinon, l'icône liste au bout de chaque titre fait pareil. Et dans vos playlists, attrapez un titre par sa poignée ⋮⋮ pour changer l'ordre."
      community:
        title: "Communautaires : tout le monde ajoute"
        text: "Cochez « Communautaire » en créant la playlist (ou plus tard, sur sa page) : toute la bande peut y glisser ses titres, et une colonne dit qui a ajouté quoi. Chacun ne retire que ses propres ajouts, et la personne qui l'a créée fait le ménage comme elle veut."
      shared:
        title: "Partagées : à écouter, pas à toucher"
        text: "Une playlist rendue publique dans Subsonic (ou depuis votre appli Subsonic) apparaît chez tout le monde dans « Partagées » : on l'écoute, mais seul son auteur la modifie. Et pour faire tourner un album en vitesse : le bouton « Partager dans le salon » sur sa page."
      mixed:
        title: "Avec des titres d'ailleurs"
        text: "Un titre YouTube ou SoundCloud se glisse dans une playlist comme les autres. Sur le site, tout est mélangé ; dans les applis Subsonic du téléphone, on ne voit que les titres de la bibliothèque."
      import:
        title: "Vos playlists de Deezer, Spotify ou Apple Music"
        text: "Collez un lien Deezer ou envoyez l'export d'une playlist Spotify ou Apple Music : chaque titre est retrouvé dans la bibliothèque, ce qui manque est cherché sur YouTube, et vous vérifiez tout avant de créer la playlist. Le guide explique comment sortir sa playlist de chaque plateforme."
    elsewhere:
      title: "YouTube, Jamendo, SoundCloud : la musique qu'on n'a pas"
      search:
        title: "Ça commence par une recherche"
        text: "Tapez un titre dans la recherche. Sous ce que la bibliothèque a trouvé, une partie « Ailleurs » s'ajoute : Jamendo répond tout de suite, et YouTube attend votre feu vert, avec un bouton. Pas de magie : un titre d'ailleurs, il faut d'abord le trouver."
      sources:
        title: "Deux caractères bien différents"
        text: "Jamendo, c'est de la musique libre : le son arrive direct dans le lecteur, sans limite. YouTube, c'est l'immense catalogue, mais il se lit dans son lecteur officiel, une petite fenêtre vidéo à droite (c'est sa règle, pub comprise s'il en met une)."
      what:
        title: "Une fois trouvé, il fait tout comme les autres"
        text: "Lecture, file d'attente, cœur, glisser-déposer dans une playlist, même communautaire : un titre d'ailleurs se comporte comme un titre de la bibliothèque. Il garde juste son étiquette « YouTube » ou « Jamendo » à la place de l'album."
      quota:
        title: "Des recherches YouTube à volonté (ou presque)"
        text: "Les recherches YouTube passent maintenant par YouTube Music : plus de quota quotidien, et des résultats plus propres (artiste, album). Chacun a droit à 120 recherches par heure, chaque recherche est gardée et resservie à la personne suivante, et si YouTube Music fait des siennes, le site repasse tout seul par l'ancienne méthode, plus limitée."
      refused:
        title: "Vidéo boudeuse"
        text: "Certaines vidéos refusent d'être lues ailleurs que sur YouTube. Le site tente alors une autre version du même titre ; sinon il vous propose de l'ouvrir sur YouTube et passe au suivant. Celles qui marchent remontent en tête des résultats (« déjà lue ici »)."
      favorites:
        title: "Importer depuis YouTube ou SoundCloud, en trois gestes"
        text: "Sur YouTube ou SoundCloud, copiez le lien (bouton Partager, ou la barre d'adresse). Ici, ouvrez Favoris et collez-le dans la partie « D'ailleurs ». C'est tout : une vidéo, un titre SoundCloud, ou une playlist YouTube entière (jusqu'à 500 titres d'un coup, dans le même ordre) atterrit dans vos favoris, prête à être lue ou glissée dans vos playlists. Les vidéos que YouTube refuse de laisser lire ici sont comptées, pas ajoutées."
      likes:
        title: "Et mes « J'aime » YouTube ?"
        text: "Ils sont privés : YouTube ne les montre à personne, même pas à nous. L'astuce : mettez ces titres dans une playlist « non répertoriée », et collez son lien."
      fine_print:
        title: "Les petits caractères"
        text: "Les titres d'ailleurs vivent sur le site : vos applis Subsonic du téléphone ne les voient pas, ils ne se téléchargent pas et ne comptent pas dans vos écoutes Last.fm. Et si une vidéo disparaît de YouTube, elle disparaît aussi de chez nous (le site vérifie chaque mois)."
    comfort:
      title: "Les petits plus"
      lyrics:
        title: "Karaoké : les paroles synchronisées"
        text: "Lancez un titre, appuyez sur L (ou le bouton micro du lecteur) : les paroles prennent la place du salon. Quand elles sont synchronisées, la ligne chantée s'allume au milieu et défile pile en rythme, même si vous sautez un passage. Sinon, le texte défile tout seul à vue de nez. Micro pas fourni, chanter faux autorisé ; touche C pour revenir au salon."
      queue:
        title: "File d'attente"
        text: "Laissez traîner la souris sur le lecteur : la file s'ouvre. Réordonnez à la souris, videz la suite, et « Annuler » rattrape les fausses manœuvres."
      shortcuts:
        title: "Raccourcis clavier"
        text: "Espace pour pause, N et P pour suivant et précédent, / pour chercher, C pour le salon, L pour les paroles, A pour la barre des artistes. Et ? pour tout voir."
      download:
        title: "Télécharger, envoyer"
        text: "Selon ce que votre compte Subsonic permet : un album en zip ou un titre seul ; et envoyer de la musique (fichiers ou zip), rangée toute seule chez son artiste."
    where:
      title: "Qui garde quoi"
      subsonic:
        title: "Dans Subsonic, donc aussi sur le téléphone"
        text: "Vos étoiles et vos cœurs, vos playlists avec leurs titres de la bibliothèque, vos écoutes (envoyées à Last.fm si vous avez relié votre compte dans Subsonic, Paramètres → Personnel)."
      site:
        title: "Seulement sur le site"
        text: "Le salon et les commentaires, l'Actualité, les favoris d'ailleurs et les titres d'ailleurs de vos playlists."
    footer: "Une idée, un bug, un coup de cœur ? Dites-le dans le salon."
