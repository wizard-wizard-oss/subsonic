    choose_count: "{count} titres"
    choose_count_one: "1 titre"
    choose_other: "Choisir un autre fichier"
    guide_link: "Comment récupérer sa playlist, plateforme par plateforme →"
    guide:
      intro: "Chaque plateforme a sa façon de sortir une playlist. Voici comment faire, pas à pas. Rien n'est modifié chez elles : on lit seulement la liste des titres."
      go: "Importer ma playlist"
      deezer:
        title: "Deezer : un simple lien"
        note: "La playlist doit être publique. Une playlist privée (dont « Coups de cœur », souvent privée) n'est pas lisible : rendez-la publique le temps de l'import, vous pourrez la remettre privée ensuite."
        step_1: "Ouvrez la playlist dans Deezer, sur le site ou dans l'application."
        step_2: "Touchez ou cliquez « … » (Plus d'options), puis « Partager » et « Copier le lien ». Sur le site, l'adresse de la page convient aussi (deezer.com/fr/playlist/…)."
        step_3: "Revenez ici, collez le lien dans le champ Deezer, puis « Lire la playlist »."
      spotify:
        title: "Spotify : un fichier CSV avec Exportify"
        note: "Spotify ne sait pas exporter une playlist lui-même. Exportify est un site gratuit, connu et open source : il lit vos playlists avec votre accord, sans rien modifier. À faire sur un ordinateur."
        step_1: "Allez sur exportify.net et cliquez sur « Get Started »."
        step_2: "Connectez-vous avec votre compte Spotify et acceptez qu'Exportify lise vos playlists."
        step_3: "La liste de vos playlists s'affiche : cliquez sur « Export » à côté de celle qui vous intéresse. Un fichier .csv est téléchargé."
        step_4: "Revenez ici, « Choisir un fichier », et prenez ce fichier .csv."
      apple_mac:
        title: "Apple Music sur Mac (ou iTunes sur PC) : un fichier XML"
        step_1: "Ouvrez l'application Musique (ou iTunes / Apple Music sur PC)."
        step_2: "Dans la barre de gauche, cliquez sur la playlist."
        step_3: "Menu Fichier → Bibliothèque → Exporter la playlist…"
        step_4: "En bas de la fenêtre, choisissez le format « Fichiers XML », puis Enregistrer."
        step_5: "Vous avez exporté toute la bibliothèque (Fichier → Bibliothèque → Exporter la bibliothèque…) ? Ça marche aussi : le site vous demandera quelle playlist importer."
        step_6: "Revenez ici, « Choisir un fichier », et prenez ce fichier .xml."
      apple_phone:
        title: "Apple Music sur iPhone ou iPad seulement"
        note: "L'iPhone ne sait pas exporter une playlist. On passe par TuneMyMusic, un site de transfert entre plateformes (la version gratuite limite le nombre de titres par transfert)."
        step_1: "Allez sur tunemymusic.com et choisissez Apple Music comme source ; connectez-vous et choisissez la playlist."
        step_2: "Comme destination, choisissez l'export vers un fichier, au format CSV."
        step_3: "Revenez ici, « Choisir un fichier », et prenez ce fichier .csv."
      others:
        title: "YouTube Music, Tidal, Amazon Music, Qobuz… : par TuneMyMusic ou Soundiiz"
        step_1: "Sur tunemymusic.com ou soundiiz.com, choisissez votre plateforme comme source et la playlist à récupérer."
        step_2: "Exportez-la vers un fichier CSV (ou texte)."
        step_3: "Revenez ici et envoyez ce fichier."
        step_4: "Dernier recours : un fichier texte avec une ligne « Artiste - Titre » par titre, tapé ou copié à la main."
      after:
        title: "Et ensuite ?"
        step_1: "Chaque titre est cherché dans la bibliothèque : « Trouvé », « À vérifier » (ressemblance moyenne ou plusieurs possibilités) ou « Introuvable »."
        step_2: "Les introuvables sont cherchés sur YouTube ; s'il y a une bonne correspondance, ils passent en « YouTube »."
        step_3: "Le menu de chaque ligne permet de changer d'avis : un autre titre de la bibliothèque, la version YouTube, ou « Ne pas ajouter »."
        step_4: "Donnez un nom, puis « Créer la playlist ». Les titres YouTube sont à leur place, mais les applications Subsonic ne voient que ceux de la bibliothèque."
