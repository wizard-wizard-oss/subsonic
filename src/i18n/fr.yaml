    import_accounts: "Relier son compte YouTube ou SoundCloud (pour importer ses « J'aime » privés) : pas encore possible."
  whatsnew:
    title: "Help"
    eyebrow: "Faites comme chez vous"
    intro: "Écouter, échanger, explorer. Retrouvez les bons gestes et découvrez tout ce que l’application vous propose."
    featured_title: "À essayer en premier"
    themes_title: "Les guides, par thème"
    themes_label: "Choisir un thème"
    guides_label: "Choisir un guide"
    steps_label: "Pas à pas"
    open: "J’y vais"
    versions: "Les dernières nouveautés"
    footer: "Une question, une idée ou un disque à conseiller ? Retrouvons-nous dans le salon."
    illustration_label: "Capture de l’application avec des données d’exemple"
    import_guide: "Voir le guide d’export"
    actions:
      chat: "Ouvrir le salon"
      lyrics: "Afficher les paroles"
      queue: "Ouvrir la file"
      shortcuts: "Ouvrir l’aide des raccourcis"
      settings: "Ouvrir les réglages"
      search: "Ouvrir la recherche"
    preview:
      chat_question: "Une découverte à partager ce soir ?"
      chat_answer: "Commencez par cet album."
      lyrics_previous: "Le couplet commence…"
      lyrics_current: "Les mots suivent la musique."
      lyrics_next: "La chanson continue."
      press_source: "Votre journal musical"
      press_title: "Un nouveau disque à découvrir"
      press_path: "Actualités → Dans la presse"
    featured:
      chat:
        title: "On en parle ensemble ?"
        text: "Ouvrez le salon, discutez en direct et faites circuler vos coups de cœur."
      lyrics:
        title: "Les paroles, en rythme"
        text: "Quand elles sont synchronisées, la ligne chantée se surligne au fil du morceau."
      press:
        title: "À lire, puis à écouter"
        text: "Ajoutez vos journaux et leurs flux RSS, puis retrouvez leurs articles sous les artistes."
    themes:
      listen:
        title: "Écouter sa musique"
        summary: "Lecteur, file et paroles"
        description: "Les gestes essentiels pour profiter de chaque morceau."
        guides:
          g1:
            title: "Lire un album entier, en aléatoire ou un morceau"
            steps:
              - "Ouvrez un album depuis sa pochette."
              - "Choisissez Lire pour l’album entier, ou Aléatoire pour mélanger ses morceaux."
              - "Pour un seul morceau, utilisez sa commande de lecture ; sur ordinateur, vous pouvez aussi double-cliquer sur sa ligne."
            note: "La petite flèche sur une pochette lance aussi l’album sans quitter la page. Le lecteur permet de mettre en pause, de passer au morceau suivant, de déplacer la lecture et de régler le volume."
          g2:
            title: "Préparer et réorganiser la file"
            steps:
              - "Ouvrez la file avec le bouton du lecteur."
              - "Utilisez Lire juste après ou Ajouter à la file."
              - "Déplacez les titres, retirez-les ou annulez votre dernier geste."
            note: "La file prépare l’écoute en cours. Une playlist conserve une sélection que vous pourrez retrouver. Sur ordinateur, les poignées et Alt + ↑ / ↓ permettent de réorganiser la file ; Annuler rattrape le dernier geste."
          g3:
            title: "Reprendre une écoute"
            steps:
              - "Votre dernière file revient à l’ouverture du site."
              - "Retrouvez le morceau et sa position dans le lecteur."
              - "Appuyez sur Lecture pour reprendre."
            note: "Les titres d’ailleurs sont conservés dans ce navigateur. Sur un autre navigateur, Subsonic retrouve ses propres morceaux."
          g4:
            title: "Suivre les paroles synchronisées"
            steps:
              - "Lancez un morceau dans le lecteur."
              - "Ouvrez les paroles avec le bouton micro ; sur ordinateur, la touche L fait aussi l’affaire."
              - "Quand les paroles sont synchronisées, suivez la ligne chantée qui se surligne au rythme du morceau."
            note: "Les paroles synchronisées suivent aussi vos sauts dans le morceau. Si seules des paroles simples sont disponibles, leur défilement est estimé. Certains morceaux n’ont pas de paroles disponibles."
          g5:
            title: "Anecdotes et raccourcis clavier"
            steps:
              - "Ouvrez les paroles pour retrouver les anecdotes disponibles au-dessus du texte."
              - "Cliquez sur une anecdote pour passer à la suivante, ou laissez-les défiler."
              - "Sur ordinateur, appuyez sur ? ou ouvrez l’aide des raccourcis depuis le menu."
            note: "Espace : pause. N / P : suivant / précédent. ← / → : avancer ou reculer. L : paroles. C : salon. A : artistes et playlists. / : recherche. Échap : fermer un panneau ou une fenêtre."
      social:
        title: "Discuter et partager"
        summary: "Salon et recommandations"
        description: "Une découverte fait souvent naître une conversation."
        guides:
          g1:
            title: "Discuter dans le salon"
            steps:
              - "Ouvrez le Salon avec son bouton ; sur ordinateur, la touche C fait aussi l’affaire."
              - "Écrivez un message, répondez à quelqu’un ou ajoutez une réaction."
              - "Depuis un album, choisissez Partager dans le salon pour envoyer sa fiche cliquable."
            note: "Le salon est commun à tous : vous y voyez aussi les personnes présentes et celles qui écrivent. Vous pouvez modifier ou supprimer vos messages. Les échanges liés à une recommandation restent privés entre les deux participants."
          g2:
            title: "Mentions, recherche et notifications"
            steps:
              - "Écrivez @ pour mentionner une personne."
              - "Retrouvez les messages dans la recherche ou l’onglet Mentions."
              - "Activez les notifications de mentions dans vos réglages."
            note: "Les badges signalent les messages non lus. Les notifications de mentions se règlent dans l’affichage du site ; votre navigateur doit aussi les autoriser."
          g3:
            title: "Voir les écoutes du moment"
            steps:
              - "Ouvrez le panneau du salon."
              - "Regardez Écouté en ce moment, au-dessus des messages."
              - "Cliquez sur une pochette pour ouvrir l’album."
            note: "La section apparaît quand des écoutes sont signalées à Subsonic."
          g4:
            title: "Commenter sous un album"
            steps:
              - "Ouvrez la fiche d’un album."
              - "Retrouvez sa discussion sous les morceaux."
              - "Répondez, mentionnez quelqu’un ou réagissez."
            note: "Chaque album possède son propre fil de discussion, distinct du salon général. Les commentaires et les notes dépendent des droits de votre compte."
          g5:
            title: "Conseiller et échanger en privé"
            steps:
              - "Sur un artiste, un album ou un morceau de la bibliothèque, choisissez Conseiller à quelqu’un. Le conseil est aussi proposé sur les fiches Discogs d’artistes et d’albums."
              - "Choisissez un membre qui s’est déjà connecté au site et ajoutez un commentaire si vous le souhaitez."
              - "Retrouvez le conseil dans À écouter et poursuivez l’échange privé avec cette personne."
            note: "La discussion reste liée à cette recommandation : elle n’est publiée ni dans le salon ni sous l’album. Si plusieurs personnes conseillent la même référence, leurs noms sont regroupés, avec un fil privé par conseiller."
          g6:
            title: "Retrouver ses conseils et archives"
            steps:
              - "Ouvrez À écouter et consultez les recommandations reçues, avec le filtre artistes, albums ou morceaux."
              - "Lancez les morceaux avec Tout écouter, ou commencez par une ligne ; gardez vos découvertes en marque-pages."
              - "Retirez les conseils déjà traités, puis retrouvez-les dans les archives ; vos envois sont aussi consultables."
            note: "Retirer une recommandation l’archive sans effacer les échanges. Les nouveaux commentaires restent accessibles, même dans les archives. Le marque-page personnel se retire indépendamment du conseil."
      explore:
        title: "Explorer de nouvelles musiques"
        summary: "Mix, artistes et labels"
        description: "Partez d’un disque que vous aimez. Voyez où il vous mène."
        guides:
          g1:
            title: "Nouveautés, genres et décennies"
            steps:
              - "Partez de l’accueil et de ses sélections."
              - "Ouvrez Albums pour parcourir genres, décennies ou ordre alphabétique."
              - "Lancez un disque depuis sa pochette ou ouvrez sa fiche."
            note: "L’accueil présente les derniers ajouts, les albums les plus écoutés, les mieux notés et ceux dont on parle. Quand Subsonic fournit ces informations, vous y retrouvez aussi les chiffres de la collection."
          g2:
            title: "Rechercher dans la bibliothèque"
            steps:
              - "Saisissez un nom d’artiste, d’album ou de morceau."
              - "Repérez les résultats dans chaque catégorie."
              - "Ouvrez une fiche ou lancez un titre."
            note: "La recherche se prolonge dans Ailleurs pour les titres absents de la bibliothèque."
          g3:
            title: "Artistes similaires et titres populaires"
            steps:
              - "Ouvrez la page d’un artiste."
              - "Commencez par ses titres populaires."
              - "Explorez les artistes similaires présents dans la bibliothèque."
            note: "Les titres populaires et les artistes similaires proviennent des informations Last.fm disponibles pour cet artiste. Les voisins proposés renvoient vers votre bibliothèque."
          g4:
            title: "Lancer une radio ou créer un mix"
            steps:
              - "Lancez une radio depuis la fiche d’un artiste ou la commande Radio de ce titre d’un morceau de la bibliothèque."
              - "Pour affiner, ouvrez le créateur de mix : artiste de départ, styles, époques, 30, 60 ou 100 titres."
              - "Choisissez de 1 à 4 niveaux d’artistes proches, vos favoris ou l’ordre chronologique, puis écoutez ou enregistrez en playlist."
            note: "Les mix en un clic proposent aussi hasard, favoris, découverte et nouveautés. Un mix personnalisé reste dans les artistes et styles retenus ; s’il manque des titres, il peut être plus court. Une playlist enregistrée conserve la sélection obtenue."
          g5:
            title: "Biographies et discographies"
            steps:
              - "Ouvrez la biographie sur la fiche d’un artiste."
              - "Choisissez la bonne identité Discogs pour sa discographie."
              - "Explorez albums, singles et participations."
            note: "Votre choix de fiche Discogs est mémorisé pour votre compte. Changer et Actualiser permettent de le corriger ou de relire le catalogue."
          g6:
            title: "Crédits, musiciens et autres groupes"
            steps:
              - "Ouvrez les crédits d’un album et choisissez son édition."
              - "Cliquez sur le nom d’un musicien ou d’un producteur."
              - "Suivez ses participations, ses groupes et ses autres projets."
            note: "Discogs et MusicBrainz peuvent se compléter. Les crédits varient selon l’édition. Les membres d’un groupe sont présentés toutes périodes confondues : les crédits de l’album indiquent qui y a réellement participé."
          g7:
            title: "Découvrir un label et son Top"
            steps:
              - "Sur un album, ouvrez Crédits Discogs et choisissez l’édition correspondant à votre disque."
              - "Cliquez sur un label, puis choisissez Découvrir le label pour varier les artistes et époques, ou Top du label pour un classement."
              - "Vérifiez les titres retrouvés dans la bibliothèque, choisissez les versions YouTube manquantes, puis écoutez ou enregistrez la sélection."
            note: "Pourquoi partir d’un album ? Un artiste peut publier chez plusieurs labels ; le label dépend de la sortie et de son édition. Le Top affiche sa source et le périmètre analysé : notes Discogs, auditeurs ou écoutes Last.fm. Vous pouvez arrêter l’analyse et garder les titres déjà prêts."
      save:
        title: "Garder et préparer ses écoutes"
        summary: "Favoris, envies et playlists"
        description: "Une envie pour demain, une sélection pour ce soir."
        guides:
          g1:
            title: "Cœurs, étoiles ou marque-pages ?"
            steps:
              - "Le cœur garde un coup de cœur dans vos favoris."
              - "Les étoiles donnent votre note à un album."
              - "Le marque-page met une découverte de côté dans À écouter."
            note: "Favoris et marque-pages restent indépendants. Vous pouvez vouloir essayer un album sans encore l’aimer."
          g2:
            title: "Retrouver ses envies dans À écouter"
            steps:
              - "Ajoutez un marque-page depuis une fiche musicale."
              - "Ouvrez À écouter et filtrez artistes, albums ou morceaux."
              - "Recherchez pour écouter, puis retirez l’envie quand vous le souhaitez."
            note: "Les marque-pages d’artistes, d’albums et de morceaux sont personnels. Une recommandation reçue peut aussi devenir un marque-page ; supprimer l’un ne supprime pas l’autre."
          g3:
            title: "Créer et organiser une playlist"
            steps:
              - "Dans l’onglet Playlists, utilisez le bouton + pour créer votre playlist."
              - "Ajoutez un morceau avec Ajouter à une playlist ; sur ordinateur, vous pouvez aussi glisser un titre ou la pochette d’un album sur une playlist."
              - "Sur la page de votre playlist, déplacez les lignes avec leur poignée ou Alt + ↑ / ↓ sur ordinateur."
            note: "Le créateur peut renommer ou supprimer la playlist et changer l’ordre des titres. Sur ordinateur, déposer un titre ou un album sur + crée directement une playlist avec ce contenu."
          g4:
            title: "Playlists partagées et communautaires"
            steps:
              - "Retrouvez les playlists publiques des autres dans Partagées : vous pouvez les écouter."
              - "À la création de votre playlist ou sur sa fiche, cochez Communautaire pour permettre aux autres d’y ajouter des morceaux."
              - "Repérez la colonne Ajouté par pour savoir qui a proposé chaque titre."
            note: "Dans une playlist communautaire, chacun retire ses propres ajouts ; le créateur peut tout retirer et garde la main sur l’ordre. Rendre une playlist publique en lecture seule se fait dans Subsonic ou depuis une application Subsonic compatible."
          g5:
            title: "Importer Spotify, Deezer ou Apple Music"
            steps:
              - "Dans l’onglet Playlists, ouvrez Importer une playlist puis le guide correspondant à votre plateforme."
              - "Collez le lien d’une playlist Deezer publique, ou envoyez le fichier exporté depuis Spotify ou Apple Music. Si l’export Apple contient plusieurs playlists, choisissez celle à importer."
              - "Vérifiez les titres trouvés, les propositions à confirmer et les versions YouTube manquantes, puis créez votre playlist."
            note: "Spotify passe par un export CSV, par exemple avec Exportify ; Apple Music utilise son export XML. M3U et listes de titres en texte sont aussi acceptés. Vous validez les correspondances avant la création : aucun accès direct à vos comptes Spotify ou Apple Music n’est nécessaire."
          g6:
            title: "Mélanger bibliothèque et titres d’ailleurs"
            steps:
              - "Trouvez un titre externe ou ajoutez-le par son lien."
              - "Ajoutez-le à une playlist comme un titre de la bibliothèque."
              - "Réorganisez la sélection pour écouter les deux ensemble."
            note: "Les applications Subsonic du téléphone voient les titres de la bibliothèque. Les titres d’ailleurs restent sur le site."
      elsewhere:
        title: "Écouter la musique d’ailleurs"
        summary: "YouTube, Jamendo, SoundCloud"
        description: "Continuez la découverte au-delà de la bibliothèque."
        guides:
          g1:
            title: "Chercher sur YouTube et Jamendo"
            steps:
              - "Lancez une recherche d’artiste ou de morceau."
              - "Consultez Ailleurs et lancez la recherche YouTube si nécessaire."
              - "Écoutez un résultat ou ajoutez-le à votre sélection."
            note: "YouTube et SoundCloud utilisent leurs lecteurs officiels, avec leurs conditions de lecture et parfois des publicités. Jamendo propose une lecture audio dans le lecteur du site. La disponibilité des sources dépend de la configuration du site."
          g2:
            title: "Ajouter un lien YouTube ou SoundCloud"
            steps:
              - "Copiez le lien d’une vidéo YouTube ou d’un titre SoundCloud."
              - "Collez-le dans Favoris, partie D’ailleurs, ou dans Mon compte."
              - "Retrouvez le morceau dans vos favoris d’ailleurs."
            note: "Le lien d’un profil ou d’une playlist SoundCloud ne remplace pas celui d’un titre."
          g3:
            title: "Importer une playlist YouTube"
            steps:
              - "Utilisez une playlist publique ou non répertoriée."
              - "Copiez son lien puis collez-le dans Favoris → D’ailleurs."
              - "Retrouvez les titres acceptés dans leur ordre."
            note: "Les J’aime YouTube et À regarder plus tard sont privés : placez les titres à importer dans une playlist publique ou non répertoriée, puis collez son lien. Jusqu’à 500 titres sont acceptés ; les vidéos refusant la lecture intégrée sont signalées."
          g4:
            title: "Garder et ajouter à une playlist"
            steps:
              - "Utilisez le cœur pour garder un titre d’ailleurs."
              - "Retrouvez-le dans Favoris → D’ailleurs."
              - "Ajoutez-le à une playlist ou à la file."
            note: "Ces favoris sont personnels et liés à votre compte sur le site."
          g5:
            title: "Comprendre les limites de lecture"
            steps:
              - "Si une vidéo refuse la lecture, une autre version peut être essayée."
              - "Utilisez Ouvrir sur YouTube si le lecteur intégré est refusé."
              - "Si la limite de recherche est atteinte, réessayez plus tard."
            note: "La limite est de 120 recherches YouTube par heure et par personne. Les titres externes ne se téléchargent pas et ne comptent pas dans les écoutes Last.fm. Une vidéo supprimée ou devenue privée peut disparaître de votre sélection."
      press:
        title: "Suivre l’actualité musicale"
        summary: "Journaux, RSS et artistes"
        description: "Les articles de vos journaux rejoignent votre parcours musical."
        guides:
          g1:
            title: "Lire les journaux et webzines"
            steps:
              - "Ouvrez Actualités depuis la navigation."
              - "Parcourez les derniers articles ou choisissez un journal."
              - "Ouvrez l’article pour le lire sur le site du journal."
            note: "Le site rassemble les liens et un début de résumé. Les articles se lisent chez leurs auteurs."
          g2:
            title: "Ajouter un journal ou un flux RSS"
            steps:
              - "Dans Actualités, choisissez Ajouter un flux."
              - "Collez l’adresse du journal ou directement celle de son flux RSS."
              - "Validez pour alimenter les actualités de tout le monde."
            note: "Le flux ajouté sert à tout le monde et il est relu chaque heure. Si l’adresse du journal ne suffit pas, utilisez celle de son flux RSS ou Atom. Une adresse de rubrique peut permettre de suivre seulement sa partie musique."
          g3:
            title: "Choisir ses sources"
            steps:
              - "Retrouvez les pastilles des journaux dans Actualités."
              - "Décochez ceux que vous souhaitez masquer."
              - "Cliquez sur une pastille pour consulter ce journal seul."
            note: "Masquer un journal ne le masque que pour vous, y compris dans Dans la presse. Retirer un flux, réservé à la personne qui l’a ajouté ou à l’administrateur, le retire pour tous et efface ses articles gardés."
          g4:
            title: "Retrouver la presse sous les groupes"
            steps:
              - "Ouvrez la page d’un artiste ou d’un groupe."
              - "Descendez sous les albums, jusqu’à Dans la presse."
              - "Ouvrez un article qui vous intéresse."
            note: "La rubrique retrouve les articles collectés qui citent l’artiste dans leur titre, parmi les sources que vous affichez. Elle se remplit avec les flux suivis depuis leur ajout et n’apparaît pas si aucun article ne correspond ; les archives complètes des journaux ne sont pas recherchées."
      settings:
        title: "Personnaliser et gérer"
        summary: "Affichage et bibliothèque"
        description: "Quelques réglages pour que l’application vous ressemble."
        guides:
          g1:
            title: "Régler l’affichage et les colonnes"
            steps:
              - "Ouvrez la roue dentée ou Mon compte → Affichage."
              - "Choisissez la densité, les pochettes et le comportement de la barre des artistes et playlists."
              - "Réglez les colonnes de Parcourir et de la file séparément : style, année, durée, débit, format, taille…"
            note: "Vos choix s’appliquent immédiatement sans interrompre l’écoute. Sur téléphone, le bouton de menu ouvre les artistes, les playlists et les liens ; le salon dispose de son propre volet. Les réglages de l’affichage sur ordinateur sont conservés."
          g2:
            title: "Personnaliser son profil"
            steps:
              - "Ouvrez Mon compte avec votre nom en haut à droite."
              - "Choisissez une image ou récupérez votre photo Gravatar."
              - "Retirez la photo du site pour revenir à celle de Subsonic."
            note: "La photo choisie sur le site est liée à votre compte."
          g3:
            title: "Télécharger ou envoyer de la musique"
            steps:
              - "Téléchargez un titre ou un album depuis sa fiche."
              - "Pour enrichir la bibliothèque, ouvrez Envoyer."
              - "Choisissez vos fichiers ou une archive ZIP."
            note: "Ces actions dépendent des droits de votre compte Subsonic."
          g4:
            title: "Pochettes et informations d’album"
            steps:
              - "Ouvrez la fiche d’un album."
              - "Utilisez le crayon de sa pochette pour changer l’image, ou Modifier les informations pour corriger les tags."
              - "Préparez vos corrections manuellement ou avec MusicBrainz ou Discogs, puis enregistrez-les dans les fichiers."
            note: "Pour une pochette, cherchez une image sur Last.fm ou collez son adresse. Les informations modifiables et les blocages éventuels sont précisés par l’éditeur, selon vos droits et les fichiers. Les corrections de tags sont suivies d’une réindexation de Subsonic."
          g5:
            title: "Comprendre son compte et ses droits"
            steps:
              - "Ouvrez Mon compte pour voir ce que votre compte permet."
              - "Retrouvez les liens Subsonic pour le mot de passe et Last.fm."
              - "En cas de mot de passe oublié, contactez l’administrateur."
            note: "Certains boutons sont réservés aux comptes autorisés à télécharger, envoyer ou modifier les informations."
          g6:
            title: "Site, téléphone et Last.fm : qui garde quoi ?"
            steps:
              - "Retrouvez cœurs, notes et titres de la bibliothèque de vos playlists dans Subsonic et ses applications compatibles."
              - "Le salon, les commentaires, les Actualités, les marque-pages, les recommandations, les choix Discogs et les titres d’ailleurs restent sur le site."
              - "Reliez Last.fm dans les réglages personnels Subsonic pour y transmettre les écoutes des morceaux de la bibliothèque."
            note: "Le site complète votre bibliothèque Subsonic. Les titres d’ailleurs des playlists et leurs favoris sont liés à votre compte sur le site ; ils n’apparaissent pas dans les applications Subsonic."

