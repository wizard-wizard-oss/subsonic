# Exemple nginx devant l'édition PC (HTTPS). Le salon utilise une connexion qui reste ouverte (/api/events) :
# pas de mise en tampon, délai long.
server {
    server_name musique.exemple.fr;
    listen 443 ssl;
    # ssl_certificate … ; ssl_certificate_key … ;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # adresse de la personne (WEB_TRUST_PROXY=true)

    location /api/events {
        proxy_pass http://127.0.0.1:8200;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
    }
    location /api/upload {              # envoi de fichiers : un album en zip peut faire 2 Go
        proxy_pass http://127.0.0.1:8200;
        client_max_body_size 2100m;
        proxy_request_buffering off;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
    }
    location / {
        proxy_pass http://127.0.0.1:8200;
        client_max_body_size 1m;
    }
}
