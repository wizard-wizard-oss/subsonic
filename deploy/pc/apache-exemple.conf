# Apache devant l'édition PC (conteneur Docker ou service systemd qui écoute sur 127.0.0.1:8200).
# À copier dans /etc/apache2/sites-available/<domaine>.conf en remplaçant musique.exemple.fr (3 fois) par le domaine.
#
#   sudo a2enmod proxy proxy_http ssl headers rewrite
#   sudo certbot certonly --apache -d musique.exemple.fr       # certificat Let's Encrypt (le DNS doit déjà pointer ici)
#   sudo a2ensite musique.exemple.fr && sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Le salon utilise une connexion qui reste ouverte (/api/events) : pas de mise en tampon ni de compression, délai long.
# Les envois de musique (/api/upload) peuvent faire 2 Go.

<VirtualHost *:80>
    ServerName musique.exemple.fr
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName musique.exemple.fr

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/musique.exemple.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/musique.exemple.fr/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    Header always set Strict-Transport-Security "max-age=31536000"
    LimitRequestBody 1048576

    # Salon en temps réel : ni compression (mod_deflate garderait les événements), ni tampon
    SetEnvIf Request_URI "^/api/events" no-gzip=1

    <Location /api/upload>
        LimitRequestBody 2147483647
    </Location>

    ProxyPass        /api/upload http://127.0.0.1:8200/api/upload timeout=600
    ProxyPass        /api/events http://127.0.0.1:8200/api/events flushpackets=on timeout=3600
    ProxyPassReverse /api/events http://127.0.0.1:8200/api/events
    ProxyPass        / http://127.0.0.1:8200/
    ProxyPassReverse / http://127.0.0.1:8200/

    ErrorLog  ${APACHE_LOG_DIR}/pimedia-error.log
    CustomLog ${APACHE_LOG_DIR}/pimedia-access.log combined
</VirtualHost>
